function shell(){let nav=[['dashboard','▦','Overview'],['members','♙','Members'],['attendance','◷','Attendance'],['payments','₹','Payments & revenue'],['qr-checkin','◫','QR Check-in']];$('#root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">F</div><span>fit<em>retain</em></span></div><div class="nav-label">WORKSPACE</div><nav class="nav">${nav.map(n=>`<button data-view="${n[0]}" class="${activeView===n[0]?'active':''}"><span class="ni">${n[1]}</span>${n[2]}</button>`).join('')}</nav><div style="margin-top:25px" class="nav-label">RETENTION</div><nav class="nav"><button data-view="at-risk" class="${activeView==='at-risk'?'active':''}"><span class="ni">◉</span>At-risk members</button></nav><div class="side-bottom"><div class="gym-tag"><div class="avatar">${esc(initials(me.name))}</div><div style="min-width:0"><strong>${esc(me.name)}</strong><small>${esc(me.email)}</small></div></div><button class="btn small" id="logout" style="margin-top:14px;width:100%;background:#24332c;color:#dce7e0;border-color:#314239">↪ Sign out</button></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu-btn" id="menuBtn">☰</button><div><div class="crumb">Workspace / <span id="crumb">Overview</span></div><div class="top-title" id="topTitle">Overview</div></div></div><div class="top-right"><span class="today">${new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><div class="top-avatar">${esc(initials(me.name))}</div></div></header><div class="content"><section class="view active" id="view-dashboard"></section><section class="view" id="view-members"></section><section class="view" id="view-attendance"></section><section class="view" id="view-payments"></section><section class="view" id="view-qr-checkin"></section><section class="view" id="view-at-risk"></section></div></main></div><div class="mobile-nav" id="mobileNav"><div class="mobile-nav-inner"><button class="close-nav" id="closeNav">×</button><div class="brand" style="padding-top:12px"><div class="logo">F</div><span>fit<em>retain</em></span></div><nav class="nav">${nav.map(n=>`<button data-view="${n[0]}"><span class="ni">${n[1]}</span>${n[2]}</button>`).join('')}<button data-view="at-risk"><span class="ni">◉</span>At-risk members</button></nav><button class="btn" id="mobileLogout" style="margin-top:22px;width:100%">Sign out</button></div></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#logout').onclick=logout;$('#mobileLogout').onclick=logout;$('#menuBtn').onclick=()=>$('#mobileNav').classList.add('open');$('#closeNav').onclick=()=>$('#mobileNav').classList.remove('open');}

n></div><div class="risk-list">${(dash?.at_risk||[]).slice(0,4).map(riskRow).join('')||empty('No members flagged right now','Nice work keeping members engaged.')}</div></div></div><div class="lower-grid"><div class="panel"><div class="panel-head"><div><h2>Attendance activity</h2><div class="sub">Check-ins recorded over the last 7 days</div></div><button class="btn small" id="seeAttendance">Open attendance →</button></div><div class="chart" id="attendanceChart"></div></div><div class="panel"><div class="panel-head"><div><h2>Quick actions</h2><div class="sub">Keep your daily operations moving</div></div></div><div class="risk-list"><div class="risk-item"><div class="person">＋</div><div class="risk-info"><strong>Add a new member</strong><small>Create a member profile and expiry date</small></div><button class="btn small" id="qaMember">Add</button></div><div class="risk-item"><div class="person">₹</div><div class="risk-info"><strong>Record a payment</strong><small>Cash, UPI, card or bank transfer</small></div><button class="btn small" id="qaPayment">Record</button></div><div class="risk-item"><div class="person">◷</div><div class="risk-info"><strong>Log today's attendance</strong><small>Keep visit history up to date</small></div><button class="btn small" id="qaAttendance">Mark</button></div></div></div></div>`;$('#addMember').onclick=()=>memberModal();$('#quickAttendance').onclick=()=>go('attendance');$('#seeRisk').onclick=()=>go('at-risk');$('#seeAttendance').onclick=()=>go('attendance');$('#qaMember').onclick=()=>memberModal();$('#qaPayment').onclick=()=>paymentModal();$('#qaAttendance').onclick=()=>go('attendance');drawLine('#revenueChart',(dash?.revenue_months||[]).map(x=>({label:x.month.slice(5),value:x.amount})),true);drawBars('#attendanceChart',(dash?.attendance_week||[]).map(x=>({label:new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}),value:x.count})));}
function riskRow(m){let why=m.reason||'Membership expiry approaching';let wa=`https://wa.me/${String(m.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(`Hi ${m.name}, this is your gym team checking in. We noticed you haven't visited recently. Is everything okay? We'd love to help you get back to your routine. Reply here if you need any support.`)}`;return `<div class="risk-item"><div class="person">${esc(initials(m.name))}</div><div class="risk-info"><strong>${esc(m.name)}</strong><small>${esc(why)}${m.expiry_date?' · Expires '+dateFmt(m.expiry_date):''}</small></div><a class="btn small" target="_blank" rel="noopener noreferrer" href="${wa}" title="Open WhatsApp chat">WhatsApp ↗</a></div>`}
function drawLine(id,items,money=false){let el=$(id);if(!items.length){el.innerHTML=empty('No revenue data yet','Record payments to see the trend.');return}let w=560,h=215,p={l:38,r:12,t:12,b:28},max=Math.max(1,...items.map(x=>x.value)),iw=w-p.l-p.r,ih=h-p.t-p.b;let points=items.map((x,i)=>[p.l+(items.length===1?iw/2:i*iw/(items.length-1)),p.t+ih-(x.value/max)*ih]);let grid=[0,.25,.5,.75,1].map(v=>`<line x1="${p.l}" y1="${p.t+ih*(1-v)}" x2="${w-p.r}" y2="${p.t+ih*(1-v)}" stroke="#edf0f3"/><text x="${p.l-7}" y="${p.t+ih*(1-v)+3}" text-anchor="end" class="small-chart-label">${money?(max*v>=1000?(max*v/1000).toFixed(0)+'k':Math.round(max*v)):Math.round(max*v)}</text>`).join('');let line=points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '),area=`${line} L ${points[points.length-1][0]},${p.t+ih} L ${points[0][0]},${p.t+ih} Z`;el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${money?'Monthly revenue':'Attendance activity'} chart">${grid}<defs><linearGradient id="chartfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7e45b" stop-opacity=".28"/><stop offset="1" stop-color="#a7e45b" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#chartfill)"/><path d="${line}" fill="none" stroke="#79b83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#79b83a" stroke-width="2"><title>${esc(items[i].label)}: ${money?fmt(items[i].value):items[i].value}</title></circle><text x="${p[0]}" y="${h-7}" text-anchor="middle" class="small-chart-label">${esc(items[i].label)}</text>`).join('')}</svg>`}
function drawBars(id,items){let el=$(id);if(!items.length){el.innerHTML=empty('No attendance yet','Record check-ins to see activity.');return}let w=500,h=205,p={l:28,r:8,t:12,b:28},max=Math.max(1,...items.map(x=>x.value)),iw=(w-p.l-p.r)/items.length,ih=h-p.t-p.b;el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily attendance chart">${[0,.5,1].map(v=>`<line x1="${p.l}" y1="${p.t+ih*(1-v)}" x2="${w-p.r}" y2="${p.t+ih*(1-v)}" stroke="#edf0f3"/><text x="${p.l-7}" y="${p.t+ih*(1-v)+3}" text-anchor="end" class="small-chart-label">${Math.round(max*v)}</text>`).join('')}${items.map((x,i)=>{let bh=x.value/max*ih,bx=p.l+i*iw+iw*.2;return `<rect x="${bx}" y="${p.t+ih-bh}" width="${iw*.6}" height="${Math.max(2,bh)}" rx="5" fill="#a8df65"><title>${esc(x.label)}: ${x.value} check-ins</title></rect><text x="${p.l+i*iw+iw/2}" y="${h-7}" text-anchor="middle" class="small-chart-label">${esc(x.label)}</text>`}).join('')}</svg>`}
function renderMembers(){let list=members;let query=($('#memberSearch')?.value||'').toLowerCase(),status=$('#memberStatus')?.value||'all';list=list.filter(m=>(m.name+' '+m.phone+' '+m.plan).toLowerCase().includes(query)&&(status==='all'||(status==='expired'?m.expiry_date<new Date().toISOString().slice(0,10):status==='expiring'?daysUntil(m.expiry_date)>=0&&daysUntil(m.expiry_date)<=7:m.expiry_date>=new Date().toISOString().slice(0,10))));$('#view-members').innerHTML=`${pageHead('Members','Manage profiles, plans and membership expiry.',`<button class="btn primary" id="newMember">＋ Add member</button>`)}<div class="panel"><div class="filters"><input id="memberSearch" placeholder="Search name, phone or plan…" value="${esc(query)}"><select id="memberStatus"><option value="all">All members</option><option value="active" ${status==='active'?'selected':''}>Active</option><option value="expiring" ${status==='expiring'?'selected':''}>Expiring in 7 days</option><option value="expired" ${status==='expired'?'selected':''}>Expired</option></select><span class="muted" style="align-self:center;font-size:12px">${list.length} result${list.length===1?'':'s'}</span></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Plan</th><th>Expires</th><th>Fee</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(m=>{let days=daysUntil(m.expiry_date),st=days<0?'Expired':days<=7?'Expiring':'Active';return `<tr><td><div class="member-cell"><div class="mini-avatar">${esc(initials(m.name))}</div><div><strong>${esc(m.name)}</strong><div class="muted" style="font-size:10px">+${esc(m.phone)} · code ${esc(m.checkin_code||'—')}</div></div></div></td><td>${esc(m.plan)}</td><td>${dateFmt(m.expiry_date)}</td><td class="money">${fmt(m.fee)}</td><td><span class="pill ${st==='Active'?'green':st==='Expired'?'red':''}">${st}</span></td><td><div style="display:flex;gap:5px"><button class="btn small renew" data-id="${m.id}">Renew</button><button class="btn small wa" data-id="${m.id}">WA ↗</button><button class="btn small danger del" data-id="${m.id}" title="Delete member">×</button></div></td></tr>`}).join('')}</tbody></table>${list.length?'':empty('No members found','Try changing your search or add a member.')}</div></div>`;$('#newMember').onclick=()=>memberModal();$('#memberSearch').oninput=()=>renderMembers();$('#memberStatus').onchange=()=>renderMembers();document.querySelectorAll('.renew').forEach(b=>b.onclick=()=>renewModal(members.find(m=>m.id==b.dataset.id)));document.querySelectorAll('.wa').forEach(b=>b.onclick=()=>{let m=members.find(m=>m.id==b.dataset.id);window.open(`https://wa.me/${m.phone}?text=${encodeURIComponent(`Hi ${m.name}, your membership at our gym expires on ${dateFmt(m.expiry_date)}. We'd love to help you renew and keep your fitness routine going. Reply here if you'd like renewal options.`)}`,'_blank','noopener')});document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{let m=members.find(m=>m.id==b.dataset.id);if(!confirm(`Delete ${m.name} and their attendance/payment history? This cannot be undone.`))return;try{await api('/members/'+m.id+'/delete','POST');await refresh();toast('Member deleted.')}catch(e){toast(e.message,true)}})}

function renderPayments(){let query=($('#paymentSearch')?.value||'').toLowerCase(),filtered=payments.filter(p=>(p.member_name+' '+p.method+' '+p.note).toLowerCase().includes(query));let total=payments.reduce((a,p)=>a+Number(p.amount),0),month=payments.filter(p=>p.paid_on.startsWith(new Date().toISOString().slice(0,7))).reduce((a,p)=>a+Number(p.amount),0);$('#view-payments').innerHTML=`${pageHead('Payments & revenue','Record payments manually. No payment gateway connection required.',`<button class="btn primary" id="newPayment">＋ Record payment</button>`)}<div class="stats"><div class="stat"><div class="stat-head">Collected this month <span class="stat-icon">₹</span></div><div class="stat-value">${fmt(month)}</div><div class="stat-foot">Based on payment date</div></div><div class="stat"><div class="stat-head">All recorded collections <span class="stat-icon">↗</span></div><div class="stat-value">${fmt(total)}</div><div class="stat-foot">${payments.length} payment records</div></div></div><div class="panel"><div class="panel-head"><div><h2>Payment history</h2><div class="sub">Manual entries · newest first</div></div></div><div class="filters"><input id="paymentSearch" placeholder="Search member or payment method…" value="${esc(query)}"></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Date</th><th>Method</th><th>Note</th><th>Amount</th><th>Data</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${esc(p.member_name)}</strong></td><td>${dateFmt(p.paid_on)}</td><td>${esc(p.method)}</td><td class="muted">${esc(p.note||'—')}</td><td class="money">${fmt(p.amount)}</td><td>${p.demo?'<span class="pill gray">DEMO</span>':'<span class="pill green">Recorded</span>'}</td></tr>`).join('')}</tbody></table>${filtered.length?'':empty('No payments recorded','Record your first payment to start tracking revenue.')}</div></div>`;$('#newPayment').onclick=()=>paymentModal();$('#paymentSearch').oninput=()=>renderPayments()}

function closeModal(){$('#overlay').innerHTML=''}
function memberModal(){showModal('Add a member',`<form id="memberForm"><div class="form-grid"><div class="field"><label>Full name *</label><input name="name" required maxlength="100" placeholder="Member name"></div><div class="field"><label>WhatsApp phone *</label><input name="phone" required inputmode="tel" placeholder="91XXXXXXXXXX"><span class="muted" style="font-size:10px">Include country code for WhatsApp.</span></div><div class="field"><label>Membership plan *</label><select name="plan"><option>Monthly</option><option>Quarterly</option><option>Half-yearly</option><option>Annual</option><option>Custom</option></select></div><div class="field"><label>Membership fee (₹) *</label><input name="fee" type="number" min="0" max="100000000" required value="1500"></div><div class="field"><label>Start date *</label><input name="start_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Expiry date *</label><input name="expiry_date" type="date" required value="${new Date(Date.now()+30*86400000).toISOString().slice(0,10)}"></div><div class="field full"><label>Notes (optional)</label><textarea name="notes" maxlength="1000" placeholder="Goals, preferences or follow-up notes"></textarea></div></div><div class="form-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save member</button></div></form>`,()=>{$('#cancelModal').onclick=closeModal;$('#memberForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent='Saving…';let d=Object.fromEntries(new FormData(e.target));try{await api('/members','POST',d);closeModal();await refresh();go('members');toast('Member added successfully.')}catch(x){toast(x.message,true);b.disabled=false;b.textContent='Save member'}}})}
function renewalExpiry(m){let base=m.expiry_date>new Date().toISOString().slice(0,10)?m.expiry_date:new Date().toISOString().slice(0,10);let d=new Date(base+'T00:00:00');d.setDate(d.getDate()+30);return d.toISOString().slice(0,10)}function renewModal(m){if(!m)return;showModal('Renew membership',`<p class="muted" style="margin-top:-7px">${esc(m.name)} · Current expiry ${dateFmt(m.expiry_date)}</p><form id="renewForm"><div class="form-grid"><div class="field"><label>Plan</label><select name="plan"><option ${m.plan==='Monthly'?'selected':''}>Monthly</option><option ${m.plan==='Quarterly'?'selected':''}>Quarterly</option><option ${m.plan==='Half-yearly'?'selected':''}>Half-yearly</option><option ${m.plan==='Annual'?'selected':''}>Annual</option><option>Custom</option></select></div><div class="field"><label>Renewal amount (₹)</label><input name="fee" type="number" min="0" value="${m.fee}" required></div><div class="field"><label>New expiry date</label><input name="expiry_date" type="date" min="${renewalExpiry(m)}" value="${renewalExpiry(m)}" required></div><div class="field"><label>Payment date</label><input name="paid_on" type="date" max="${new Date().toISOString().slice(0,10)}" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field full"><label>Payment method</label><select name="method"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></div></div><p class="muted" style="font-size:11px">Renewal creates a payment record when the amount is greater than ₹0. This is a manual record, not a gateway charge.</p><div class="form-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Confirm renewal</button></div></form>`,()=>{$('#cancelModal').onclick=closeModal;$('#renewForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await api('/members/'+m.id+'/renew','POST',Object.fromEntries(new FormData(e.target)));closeModal();await refresh();go('members');toast('Membership renewed.')}catch(x){toast(x.message,true);b.disabled=false}}})}
function attendanceModal(){if(!members.length){toast('Add a member before recording attendance.',true);memberModal();return}showModal('Mark attendance',`<form id="attendanceForm"><div class="form-grid"><div class="field full"><label>Member *</label><select name="member_id" required>${members.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.phone)}</option>`).join('')}</select></div><div class="field full"><label>Attendance date *</label><input name="date" type="date" required max="${new Date().toISOString().slice(0,10)}" value="${attendanceDay||new Date().toISOString().slice(0,10)}"></div></div><div class="form-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Record check-in</button></div></form>`,()=>{$('#cancelModal').onclick=closeModal;$('#attendanceForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await api('/attendance','POST',Object.fromEntries(new FormData(e.target)));closeModal();attendanceDay=e.target.date.value;await refresh();go('attendance');toast('Attendance recorded.')}catch(x){toast(x.message,true);b.disabled=false}}})}
function paymentModal(){if(!members.length){toast('Add a member before recording a payment.',true);memberModal();return}showModal('Record a payment',`<form id="paymentForm"><div class="form-grid"><div class="field full"><label>Member *</label><select name="member_id" required>${members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Amount (₹) *</label><input name="amount" type="number" min="1" max="100000000" required placeholder="1500"></div><div class="field"><label>Payment date *</label><input name="paid_on" type="date" max="${new Date().toISOString().slice(0,10)}" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Method *</label><select name="method"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></div><div class="field"><label>Note</label><input name="note" maxlength="300" placeholder="Monthly fee, PT session…"></div></div><p class="muted" style="font-size:11px">Manual entry only. FitRetain will not charge a card or contact a payment provider.</p><div class="form-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save payment</button></div></form>`,()=>{$('#cancelModal').onclick=closeModal;$('#paymentForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await api('/payments','POST',Object.fromEntries(new FormData(e.target)));closeModal();await refresh();go('payments');toast('Payment recorded.')}catch(x){toast(x.message,true);b.disabled=false}}})}
async function loadAttendance(){let d=await api('/attendance?date='+encodeURIComponent(attendanceDay));window.todayAttendance=d.attendance}
async function ensureQrLib(){if(window.QRCode)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load QR generator.'));document.head.appendChild(s);})}
async function renderQrCheckin(){const state=qrState||{};$('#view-qr-checkin').innerHTML=`${pageHead('QR Check-in','Place this QR at the gym entrance so members can check in from their phone in seconds.',`<button class="btn primary" id="qrRefresh">↻ Refresh</button>`)}<div class="qr-layout"><div class="panel"><div class="panel-head"><div><h2>Gym entrance QR</h2><div class="sub">Public check-in link for ${esc(state.gym_name||me.name)}</div></div></div><div class="qr-embed"><canvas id="qrCodeCanvas" width="220" height="220"></canvas><div id="qrFallback" class="qr-fallback" style="display:none">QR preview could not load. Use the public link below.</div></div><div class="qr-actions"><button class="btn small" id="qrPreview">Preview</button><button class="btn small" id="qrDownload">Download PNG</button><button class="btn small" id="qrPrint">Print QR</button></div><div class="qr-link"><strong>Public check-in URL</strong><a href="${esc(state.public_url||'#')}" target="_blank" rel="noopener">${esc(state.public_url||'Generate a QR code first.')}</a></div></div><div class="panel"><div class="panel-head"><div><h2>Setup guide</h2><div class="sub">Keep the check-in flow simple and secure</div></div></div><ol class="qr-steps"><li>Print the QR and place it at the main entrance where members naturally walk in.</li><li>Ask members to scan the code with their normal phone camera and complete the secure verification step.</li><li>Use the generated member check-in code as the verification method when SMS/OTP is not configured.</li></ol><div class="qr-note"><strong>Security note:</strong> The public page never exposes your private member list. It only verifies the member’s registered phone number and their unique check-in code before recording attendance.</div></div></div>`;$('#qrRefresh').onclick=async()=>{try{qrState=await api('/qr');renderQrCheckin();toast('QR updated.')}catch(e){toast(e.message,true)}};if(state.public_url){try{await ensureQrLib();const canvas=$('#qrCodeCanvas');if(canvas){QRCode.toCanvas(canvas,state.public_url,{width:220,margin:1,color:{dark:'#14211c',light:'#ffffff'}},err=>{if(err){canvas.style.display='none';$('#qrFallback').style.display='block';}})}$('#qrPreview').onclick=()=>window.open(state.public_url,'_blank','noopener');$('#qrDownload').onclick=()=>{const c=$('#qrCodeCanvas');const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='fitretain-qr-checkin.png';a.click();};$('#qrPrint').onclick=()=>window.print();}catch(e){$('#qrFallback').style.display='block';}}}
async function refresh(){let results=await Promise.all([api('/dashboard'),api('/members'),api('/payments'),api('/qr')]);dash=results[0];members=results[1].members;payments=results[2].payments;qrState=results[3];await loadAttendance();if(activeView==='dashboard')renderDashboard();else if(activeView==='members')renderMembers();else if(activeView==='payments')renderPayments();else if(activeView==='attendance')renderAttendance();else if(activeView==='qr-checkin')renderQrCheckin();else renderRisk()}
async function logout(){try{await api('/logout','POST')}catch{}me=null;csrf='';authScreen('login')}
async function boot(){shell();try{await refresh()}catch(e){$('#root').insertAdjacentHTML('beforeend',`<div class="toast error">${esc(e.message)}. Please refresh.</div>`)}}
(async()=>{try{let r=await fetch('/api/me');let d=await r.json();if(d.user){me=d.user;csrf=me.csrf;await boot()}else authScreen('login')}catch(e){$('#root').innerHTML='<div class="loading">Could not connect to FitRetain. Check that the local server is running.</div>'}})();
</script></body></html>
